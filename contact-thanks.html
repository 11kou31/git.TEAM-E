<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gravitas+One&family=Poppins:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/contact-thanks.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

    <div id="header"></div>
    <div class="page-wrap text-center">

        <i class="bi bi-check-circle-fill thanks-icon mb-4"></i>

        <h4 class="title mb-3">送信ありがとうございました</h4>

        <div class="card-box">

            <p class="message mb-2">
                <span class="user-name" id="user-name"></span>
                お問い合わせを受け付けました。
            </p>

            <p class="message mb-0">
                内容を確認のうえ、担当者よりご連絡いたします。
            </p>

        </div>

        <a href="index.html" class="btn-home">トップへ戻る</a>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");

        if (name) {
            document.getElementById("user-name").textContent = name + " さん、";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
