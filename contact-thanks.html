<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #f6f9ff, #ffffff);
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        .page-wrap {
            max-width: 420px;
            margin: auto;
            padding: 40px 16px 50px;
        }

        .thanks-icon {
            font-size: 4.5rem;
            color: #4CAF50;
        }

        .title {
            font-weight: 700;
        }

        .message {
            font-size: .95rem;
            color: #555;
            line-height: 1.7;
        }

        .card-box {
            background: #ffffff;
            border-radius: 22px;
            padding: 24px 20px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, .08);
        }

        .btn-home {
            display: block;
            margin-top: 28px;
            border-radius: 999px;
            padding: 14px 0;
            font-size: 1rem;
            background: linear-gradient(135deg, #1a53ff, #4f7cff);
            color: #fff;
            text-decoration: none;
            box-shadow: 0 8px 16px rgba(26, 83, 255, .35);
        }

        .btn-home:active {
            transform: scale(.97);
        }

        .user-name {
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="page-wrap text-center">

        <i class="bi bi-check-circle-fill thanks-icon mb-4"></i>

        <h4 class="title mb-3">送信ありがとうございました</h4>

        <div class="card-box">

            <p class="message mb-2">
                <span class="user-name" id="user-name"></span>
                お問い合わせを受け付けました。
            </p>

            <p class="message mb-0">
                内容を確認のうえ、担当者よりご連絡いたします。
            </p>

        </div>

        <a href="index.html" class="btn-home">トップへ戻る</a>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");

        if (name) {
            document.getElementById("user-name").textContent = name + " さん、";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
