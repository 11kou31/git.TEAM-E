<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確認画面</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #f6f9ff, #ffffff);
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        .page-wrap {
            max-width: 420px;
            margin: auto;
            padding: 24px 16px 40px;
        }

        .title {
            font-weight: 700;
            letter-spacing: .05em;
        }

        .check-icon {
            font-size: 4.2rem;
            color: #4CAF50;
        }

        .confirm-card {
            background: #ffbb62;
            border-radius: 24px;
            padding: 28px 22px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, .08);
        }

        .confirm-item {
            margin-bottom: 22px;
        }

        .confirm-label {
            font-size: .8rem;
            color: #555;
        }

        .confirm-value {
            font-size: 1rem;
            font-weight: 600;
            padding: 6px 2px;
            border-bottom: 1px solid rgba(0, 0, 0, .4);
            word-break: break-all;
        }

        .btn-area {
            display: flex;
            gap: 14px;
        }

        .btn-custom {
            flex: 1;
            border-radius: 999px;
            padding: 14px 0;
            font-size: 1rem;
            border: none;
        }

        .btn-back {
            background: #f2f2f2;
        }

        .btn-submit {
            background: linear-gradient(135deg, #1a53ff, #4f7cff);
            color: #fff;
            box-shadow: 0 8px 16px rgba(26, 83, 255, .35);
        }

        .btn-submit:active {
            transform: scale(.97);
        }
    </style>
</head>

<body>

    <form action="contact-thanks.html" method="get">

        <!-- hidden（thanksへ送る用） -->
        <input type="hidden" name="type" id="hidden-type">
        <input type="hidden" name="name" id="hidden-name">
        <input type="hidden" name="email" id="hidden-email">
        <input type="hidden" name="tel" id="hidden-tel">
        <input type="hidden" name="message" id="hidden-message">

        <div class="page-wrap text-center">

            <h5 class="title mt-3">確認</h5>

            <div class="my-4">
                <i class="bi bi-check-circle-fill check-icon"></i>
            </div>

            <p class="text-muted small mb-4">
                以下の内容で送信してもよろしいですか？
            </p>

            <div class="confirm-card text-start mb-4">

                <div class="confirm-item">
                    <div class="confirm-label">問い合わせ種別</div>
                    <div class="confirm-value" id="confirm-type"></div>
                </div>

                <div class="confirm-item">
                    <div class="confirm-label">お名前</div>
                    <div class="confirm-value" id="confirm-name"></div>
                </div>

                <div class="confirm-item">
                    <div class="confirm-label">メールアドレス</div>
                    <div class="confirm-value" id="confirm-email"></div>
                </div>

                <div class="confirm-item">
                    <div class="confirm-label">電話番号</div>
                    <div class="confirm-value" id="confirm-tel"></div>
                </div>

                <div class="confirm-item mb-0">
                    <div class="confirm-label">お問い合わせ内容</div>
                    <div class="confirm-value" id="confirm-message"></div>
                </div>

            </div>

            <div class="btn-area">
                <button type="button" class="btn btn-custom btn-back" onclick="history.back()">戻る</button>
                <button type="submit" class="btn btn-custom btn-submit">送信</button>
            </div>

        </div>
    </form>

    <script>
        const params = new URLSearchParams(window.location.search);

        const type = params.get("type");
        const name = params.get("name");
        const email = params.get("email");
        const tel = params.get("tel");
        const message = params.get("message");

        document.getElementById("confirm-type").textContent = type || "";
        document.getElementById("confirm-name").textContent = name || "";
        document.getElementById("confirm-email").textContent = email || "";
        document.getElementById("confirm-tel").textContent = tel || "未入力";
        document.getElementById("confirm-message").textContent = message || "";

        document.getElementById("hidden-type").value = type || "";
        document.getElementById("hidden-name").value = name || "";
        document.getElementById("hidden-email").value = email || "";
        document.getElementById("hidden-tel").value = tel || "";
        document.getElementById("hidden-message").value = message || "";
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
