<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="icon" href="img/favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gravitas+One&family=Poppins:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">


</head>

<body>

    <div id="header"></div>
    <div class="container form-container">
        <h2 class="text-center mt-5 mb-5">お問い合わせ</h2>

        <form action="contact-confirm.html" method="get">

            <!-- 問い合わせ種別 -->
            <div class="row mb-4 align-items-center">
                <label class="col-sm-4 col-form-label">
                    問い合わせ種別 <span class="required">必須</span>
                </label>
                <div class="col-sm-8">
                    <select class="form-select" name="type" required>
                        <option value="">選択してください</option>
                        <option value="チケットについて">チケットについて</option>
                        <option value="会場について">会場について</option>
                        <option value="出演者について">出演者について</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
            </div>

            <!-- 名前 -->
            <div class="row mb-4 align-items-center">
                <label for="name" class="col-sm-4 col-form-label">
                    お名前 <span class="required">必須</span>
                </label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
            </div>

            <!-- メール -->
            <div class="row mb-4 align-items-center">
                <label for="email" class="col-sm-4 col-form-label">
                    メールアドレス <span class="required">必須</span>
                </label>
                <div class="col-sm-8">
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
            </div>

            <!-- 電話番号 -->
            <div class="row mb-4 align-items-center">
                <label for="tel" class="col-sm-4 col-form-label">
                    電話番号
                </label>
                <div class="col-sm-8">
                    <input type="tel" class="form-control" id="tel" name="tel" placeholder="例）090-1234-5678">
                </div>
            </div>

            <!-- お問い合わせ内容 -->
            <div class="mb-5">
                <label for="message" class="form-label">
                    お問い合わせ内容 <span class="required">必須</span>
                </label>
                <textarea class="form-control" id="message" name="message" rows="6" required></textarea>
            </div>

            <!-- ボタン -->
            <div class="text-center mb-5">
                <button type="submit" class="btn btn-custom-red rounded-pill px-5 py-2">
                    確認画面へ
                </button>

                <!-- ボタン直下に配置 -->
                <div class="mt-2">
                    <a href="privacy.html" target="_blank" class="privacy-link">
                        プライバシーポリシーはこちら
                    </a>
                </div>
            </div>



        </form>
    </div>
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>

</body>

</html>
