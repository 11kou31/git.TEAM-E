<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fff;
            padding-top: 50px;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .btn-custom-red {
            background-color: #fc4d4d;
            border-color: #fc4d4d;
            color: white;
            font-size: 1.1rem;
        }

        .btn-custom-red:hover {
            background-color: #e03c3c;
            border-color: #e03c3c;
            color: white;
        }

        .form-control,
        .form-select {
            border-radius: 0;
            border-color: #666;
        }
    </style>
</head>

<body>
    <div class="container form-container">
        <h2 class="text-center mb-5">お問い合わせ</h2>

        <!-- ★ここを修正 -->
        <form action="contact-confirm.html" method="get">

            <div class="row mb-4 align-items-center">
                <label for="name" class="col-sm-4 col-form-label">名前</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="name" name="name">
                </div>
            </div>

            <div class="row mb-4 align-items-center">
                <label for="email" class="col-sm-4 col-form-label">メールアドレス</label>
                <div class="col-sm-8">
                    <input type="email" class="form-control" id="email" name="email">
                </div>
            </div>

            <div class="mb-5">
                <label for="message" class="form-label">お問い合わせ内容</label>
                <textarea class="form-control" id="message" name="message" rows="6"></textarea>
            </div>

            <div class="text-center mb-5">
                <button type="submit" class="btn btn-custom-red rounded-pill px-5 py-2">
                    確認
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
