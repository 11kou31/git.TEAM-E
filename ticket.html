<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チケット購入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/tikcet.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gravitas+One&family=Poppins:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
</head>
<body>
    <div id="header"></div>
    <div class="container my-5 text-center">
        
        <h1>チケット料金</h1>
        <img src="img/ticket.png" class="img-fluid d-block mx-auto mb-4" alt="チケット料金表">
        
        <h4 class="mb-4">※小学生以下の方は保護者同伴で<br>のみご入場いただけます</h4>
        
        <hr class="my-5">
        
        <h1>チケット購入手順</h1>
        
        <div class="steps mb-5">
            <p>1. 下記のボタンをクリックしてチケット<br>購入ページに飛んでください</p>
            <p>2. 来場者様の情報を入力し、<br>購入する枚数を選択してください。</p>
            <p>3. 枚数が確定したら購入ボタンをクリックし、<br>入力したメールアドレス宛に購入確認メールが届きましたら<br>購入完了となります。</p>
        </div>

        <div class="d-flex justify-content-center mt-4">
            <button class="btn btn-custom">チケット購入ページ</button>
        </div>
        
    </div>
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
 
</body>
</html>
